# Cláusulas objetivo de un merger agreement: QUÉ buscar en el contrato.
# (Cómo calificar lo encontrado está en playbook.yaml.)
#
# Para añadir una cláusula: copia un bloque, cambia el id y rellena los campos.

contract_type: merger_agreement

clauses:
  - id: termination_fee
    name: Termination fee
    # Explicación completa en docs/guia-de-clausulas.md
    summary: >
      Cantidad que paga una parte a la otra si el contrato se termina por
      causas atribuibles a ella (típicamente, aceptar una oferta mejor o que
      su consejo retire la recomendación).
    # Dónde buscarla. El motor selecciona estos trozos del contrato y solo
    # esos se envían al modelo. La cuantía suele estar en las definiciones.
    where_to_look:
      section_titles: ["Termination Fee"]   # Sections cuyo título contiene esto
      defined_terms: ["Termination Fee"]    # definiciones cuyo término contiene esto
    # Datos que hay que sacar del texto, cada uno con su cita literal.
    # type: number -> el valor debe ser un número (sin símbolos ni comas).
    extract:
      - field: amount_usd
        type: number
        description: Importe de la termination fee en dólares. Uno por cada parte que pueda tener que pagarla.
      - field: triggers
        type: text
        description: Resumen breve de los supuestos en los que esa parte paga la fee.
